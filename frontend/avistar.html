<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0E3B36">
<title>Avistar · Humedales de Valdivia</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="humedal">
<header class="ph-header">
  <a class="back" id="back" href="#">‹</a>
  <div><h1>Registrar avistamiento</h1><p class="sub">Ciencia ciudadana</p></div>
</header>

<div class="ph-wrap">
  <div class="ph-card">
    <p>Sacá una foto de una especie del humedal. La <strong>IA de iNaturalist</strong> la identifica y tu ubicación confirma que estás en terreno.</p>
    <form id="form" class="ph-form">
      <label>Foto de la especie</label>
      <label class="ph-foto-zona" id="foto-zona">
        <span class="ico">📷</span>
        <span id="foto-texto">Tocá para sacar la foto</span>
        <small>Se abre la cámara de tu celular</small>
        <input type="file" id="foto" accept="image/*" capture="environment" required>
      </label>
      <div id="geo" class="ph-geo ph-geo--wait">📍 Obteniendo tu ubicación…</div>
      <button type="submit" class="ph-btn" id="enviar" disabled>Identificar y registrar</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/geo.js"></script>
<script src="js/avatar.js"></script>
<script src="js/puntos.js"></script>
<script>
(async function () {
  var id = new URLSearchParams(location.search).get('id') || 'laguna-los-patos';
  // Los Guardianes (menores de 13) no suben fotos: su reto Observar es reconocer
  if (PH_PERFIL === 'guardian') { location.replace('observar.html?id=' + id); return; }
  document.getElementById('back').href = 'humedal.html?id=' + id;
  var feature = await phFeatureDe(id);
  var pos = null, dentro = false;
  var geoBox = document.getElementById('geo'), enviar = document.getElementById('enviar');

  // Vista previa de la foto en la zona tocable
  document.getElementById('foto').addEventListener('change', function () {
    var f = this.files[0];
    var zona = document.getElementById('foto-zona');
    if (!f) return;
    zona.classList.add('ok');
    var img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    zona.querySelector('.ico').textContent = '✓';
    document.getElementById('foto-texto').textContent = 'Foto lista — tocá para cambiarla';
    var prev = zona.querySelector('img'); if (prev) prev.remove();
    zona.appendChild(img);
  });

  function pedirGeo() {
    if (!navigator.geolocation) { geoBox.className = 'ph-geo ph-geo--no'; geoBox.textContent = 'Tu dispositivo no permite geolocalización.'; return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      pos = { lat: p.coords.latitude, lon: p.coords.longitude };
      dentro = phEnHumedal(pos.lon, pos.lat, feature);
      if (dentro) { geoBox.className = 'ph-geo ph-geo--ok'; geoBox.textContent = '✓ Estás dentro del humedal. Podés registrar.'; enviar.disabled = false; }
      else { geoBox.className = 'ph-geo ph-geo--no'; geoBox.textContent = '✗ Estás fuera del polígono del humedal. El avistamiento debe hacerse en terreno.'; }
    }, function () { geoBox.className = 'ph-geo ph-geo--no'; geoBox.textContent = 'No pudimos obtener tu ubicación. Activá el GPS.'; });
  }
  pedirGeo();

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg');
    var f = document.getElementById('foto').files[0];
    if (!f || !dentro) return;
    enviar.disabled = true; msg.className = 'ph-msg'; msg.textContent = 'Identificando especie…';
    var fd = new FormData();
    fd.append('foto', f); fd.append('lat', pos.lat); fd.append('lon', pos.lon);
    fd.append('humedal_id', id); fd.append('perfil', PH_PERFIL || 'guardabosques');
    try {
      var r = await fetch(PH_API_URL + '/api/avistamiento', { method: 'POST', body: fd });
      if (!r.ok) throw new Error('backend');
      var data = await r.json();
      msg.className = 'ph-msg ph-msg--ok';
      var g1 = phSumarPuntos('avistamiento');
      msg.innerHTML = '✓ Registrado: <strong>' + (data.especie || 'especie de humedal') + '</strong>' +
        (data.confianza ? ' (' + Math.round(data.confianza * 100) + '% de confianza)' : '') +
        '<br>🎟️ +' + g1 + ' puntos · <a href="cupones.html?id=' + id + '">ver cupones</a>';
      phDecir(phHistoria('avistamiento'));
    } catch (err) {
      if (PH_MODO_DEMO_FALLBACK) {
        var demo = ['Cygnus melancoryphus (Cisne de cuello negro)', 'Ardea alba (Garza grande)', 'Vanellus chilensis (Queltehue)'];
        msg.className = 'ph-msg ph-msg--ok';
        var g2 = phSumarPuntos('avistamiento');
        msg.innerHTML = '✓ <em>(demo)</em> Registrado: <strong>' + demo[Math.floor(Math.random()*demo.length)] + '</strong>' +
          '<br>🎟️ +' + g2 + ' puntos · <a href="cupones.html?id=' + id + '">ver cupones</a>';
        phDecir(phHistoria('avistamiento'));
      } else {
        msg.className = 'ph-msg ph-msg--err'; msg.textContent = 'No pudimos procesar el avistamiento. Intentá de nuevo.';
        enviar.disabled = false;
      }
    }
  });
})();
</script>
<footer class="ph-foot">Los puntos se ganan solo con acciones geolocalizadas dentro del polígono del humedal.</footer>
</body>
</html>
