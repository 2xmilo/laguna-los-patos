<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A2C28">
<title>Tour 360° · Humedales de Valdivia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/suave.css?v=m13">
</head>
<body class="tour-body">

<!-- Panorama a pantalla completa -->
<div id="panorama"></div>

<!-- UI flotante -->
<a class="tour-btn tour-volver" id="back" href="#" aria-label="Volver">‹</a>
<div class="tour-titulo">
  <h1 id="t-titulo">Tour 360°</h1>
  <p id="t-tema">Recorrido inmersivo</p>
</div>
<button class="tour-btn tour-full" id="btn-full" aria-label="Pantalla completa">⛶</button>

<!-- Brújula: la misma rosa de los vientos del mapa (index.html). La punta roja
     apunta al norte real; tocarla te reorienta al norte. -->
<button class="tour-brujula" id="brujula" aria-label="Brújula: tocá para mirar al norte">
  <svg viewBox="0 0 48 48" fill="none" id="rosa" aria-hidden="true"><circle cx="24" cy="24" r="21" stroke="#d7ded4" stroke-width="1.5"/><circle cx="24" cy="24" r="15" stroke="#eef1ec" stroke-width="1"/><path d="M24 6 27 24 24 21 21 24z" fill="#e5484d"/><path d="M24 42 21 24 24 27 27 24z" fill="#3a5a3f"/><path d="M42 24 24 27 27 24 24 21z" fill="#8a938a"/><path d="M6 24 24 21 21 24 24 27z" fill="#8a938a"/><circle cx="24" cy="24" r="2.4" fill="#21301f"/></svg>
</button>

<div class="tour-hint" id="hint">Arrastrá para mirar · tocá una flecha para viajar</div>

<!-- Estaciones como miniaturas circulares -->
<div class="tour-abajo">
  <a id="t-accion" class="tour-accion" href="#">Acción de esta estación</a>
  <div class="tour-estaciones" id="nav"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/avatar.js?v=3"></script>
<script src="js/puntos.js"></script>
<script>
(async function () {
  var id = new URLSearchParams(location.search).get('id') || 'laguna-los-patos';

  var meta = await (await fetch('data/humedales.json')).json();
  var E = meta.estaciones;
  var h = meta.humedales.find(function (x) { return x.id === id && x.estaciones.length; })
       || meta.humedales.find(function (x) { return x.estaciones.length; });
  id = h.id;
  var viewer = null, actual = null;

  /* ==================================================================
     Geometría real: GPS + rumbo + ALTITUD del dron (humedales.json)
     ================================================================== */
  var R2D = 180 / Math.PI, D2R = Math.PI / 180;

  function distM(a, b) {
    var R = 6371e3, f1 = a[0]*D2R, f2 = b[0]*D2R;
    var df = (b[0]-a[0])*D2R, dl = (b[1]-a[1])*D2R;
    var x = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }
  function rumbo(a, b) { // grados desde el norte, 0-360
    var f1 = a[0]*D2R, f2 = b[0]*D2R, dl = (b[1]-a[1])*D2R;
    var y = Math.sin(dl)*Math.cos(f2);
    var x = Math.cos(f1)*Math.sin(f2) - Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
    return (Math.atan2(y, x) * R2D + 360) % 360;
  }
  function distTxt(m) { return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km'; }
  function normYaw(y) { y = y % 360; if (y > 180) y -= 360; if (y < -180) y += 360; return y; }

  /* El marcador se apoya en el SUELO bajo la estación destino, no en su
     cámara. El pano está `altitud` m sobre el terreno (RelativeAltitude del
     dron) y el humedal es plano, así que el suelo del destino queda `altitud`
     m más abajo, a `d` m de distancia horizontal. Por eso desde un pano alto
     las flechas caen en picada y desde uno bajo quedan casi en el horizonte:
     antes todas estaban clavadas en pitch -4 y por eso se veían a la misma
     altura sin importar desde dónde mirabas. */
  function pitchSuelo(alt, d) {
    return Math.max(-80, -Math.atan2(alt || 0, Math.max(d, 1)) * R2D);
  }

  /* Tamaño aparente: lo cercano se ve grande, lo lejano chico. */
  function escala(d) {
    return Math.min(1.25, Math.max(0.62, Math.pow(80 / Math.max(d, 1), 0.4))).toFixed(3);
  }

  function humedalDe(slug) {
    return meta.humedales.find(function (x) { return x.estaciones.indexOf(slug) >= 0; });
  }

  /* ==================================================================
     Marcadores
     ================================================================== */
  /* Dos íconos, sin emojis. La ESTACIÓN es un disco elíptico que se lee
     apoyado en el pasto (va con el pitch calculado por altitud) y el CRUCE a
     otro humedal es un anillo doble dorado, de otra familia visual. */
  var ICONO = {
    estacion:
      '<svg class="ph-hs__svg" viewBox="0 0 96 96" aria-hidden="true">' +
        '<ellipse cx="48" cy="50" rx="32" ry="13.5" fill="rgba(255,255,255,.92)"/>' +
        '<ellipse cx="48" cy="50" rx="32" ry="13.5" fill="none" stroke="rgba(10,44,40,.32)" stroke-width="1.6"/>' +
        '<path d="M36 55 L48 44 L60 55" fill="none" stroke="#0A2C28" stroke-width="4.6" ' +
              'stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>',
    cruce:
      '<svg class="ph-hs__svg" viewBox="0 0 96 96" aria-hidden="true">' +
        '<circle cx="48" cy="48" r="24" fill="none" stroke="#C98A2D" stroke-width="2.6" opacity=".75"/>' +
        '<circle cx="48" cy="48" r="15" fill="rgba(201,138,45,.3)" stroke="#C98A2D" stroke-width="3"/>' +
        '<circle cx="48" cy="48" r="5" fill="#fff"/>' +
      '</svg>'
  };

  function marcador(div, a) {
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', a.aria);
    div.title = a.aria;
    div.style.setProperty('--esc', a.esc);
    div.innerHTML = (a.cruce ? ICONO.cruce : ICONO.estacion) +
      (a.etiqueta ? '<span class="ph-hs__txt">' + a.etiqueta + '</span>' : '');
  }

  /* Dentro de un humedal la flecha va limpia. La que CRUZA a otro humedal
     lleva etiqueta con el nombre del humedal, para que se lea como un salto
     distinto y no como una estación más. */
  /* El cruce no es un punto en el suelo sino un destino lejano, así que se lo
     levanta un poco sobre la línea del terreno para despegarlo del horizonte. */
  var ALZA_CRUCE = 5;

  function hotspot(desde, hacia, d, nombreHumedal) {
    var a = E[desde], b = E[hacia];
    return {
      pitch: pitchSuelo(a.altitud, d) + (nombreHumedal ? ALZA_CRUCE : 0),
      yaw: normYaw(rumbo(a.centro, b.centro) - (a.norte || 0)),
      cssClass: 'ph-hs' + (nombreHumedal ? ' ph-hs--cruce' : ''),
      createTooltipFunc: marcador,
      createTooltipArgs: {
        esc: escala(d),
        cruce: !!nombreHumedal,
        etiqueta: nombreHumedal ? nombreHumedal + ' · ' + distTxt(d) : '',
        aria: (nombreHumedal ? 'Cruzar a ' + nombreHumedal + ', ' : '') + b.nombre + ', a ' + distTxt(d)
      },
      clickHandlerFunc: function () { viajar(desde, hacia); }
    };
  }

  function escena(slug, hm) {
    var est = E[slug], spots = [];

    hm.estaciones.forEach(function (s) {
      if (s === slug || !est.centro || !E[s].centro) return;
      spots.push(hotspot(slug, s, distM(est.centro, E[s].centro), null));
    });

    // Cruce a otro humedal: se entra por su estación más cercana.
    meta.humedales.forEach(function (o) {
      if (o.id === hm.id || !o.estaciones.length || !est.centro) return;
      var mejor = null, md = Infinity;
      o.estaciones.forEach(function (s) {
        var c = E[s].centro; if (!c) return;
        var d = distM(est.centro, c);
        if (d < md) { md = d; mejor = s; }
      });
      if (mejor) spots.push(hotspot(slug, mejor, md, o.nombre));
    });

    var cfg = { type: 'equirectangular', panorama: est.pano, hotSpots: spots };
    if (est.vista) { // fotos parciales (no 360): limitan el giro
      cfg.haov = est.vista.haov; cfg.vaov = est.vista.vaov;
      cfg.minYaw = -est.vista.haov / 2; cfg.maxYaw = est.vista.haov / 2;
      cfg.minPitch = -est.vista.vaov / 2; cfg.maxPitch = est.vista.vaov / 2;
      cfg.pitch = est.vista.pitchInicial || 0;
    }
    return cfg;
  }

  /* Todas las estaciones de todos los humedales son escenas del MISMO visor:
     así el salto es un fundido (loadScene) y no destruir + recrear el visor. */
  var scenes = {};
  meta.humedales.forEach(function (hm) {
    hm.estaciones.forEach(function (slug) { scenes[slug] = escena(slug, hm); });
  });

  /* ==================================================================
     Viajar entre estaciones conservando la orientación
     ================================================================== */
  // Al tocar una flecha llegás mirando hacia donde venías caminando.
  function viajar(desde, hacia) {
    var a = E[desde], b = E[hacia];
    var yaw = normYaw(rumbo(a.centro, b.centro) - (b.norte || 0));
    viewer.loadScene(hacia, 0, yaw, viewer.getHfov());
  }
  // Al tocar una miniatura se conserva el rumbo real que estabas mirando,
  // para que el mundo no "gire" al cambiar de foto.
  function saltar(hacia) {
    if (hacia === actual) return;
    var a = E[actual], b = E[hacia];
    var mundo = viewer.getYaw() + (a.norte || 0);
    viewer.loadScene(hacia, 0, normYaw(mundo - (b.norte || 0)), viewer.getHfov());
  }

  /* ==================================================================
     UI
     ================================================================== */
  var full = document.getElementById('btn-full');
  if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
    full.style.display = 'none';
  }
  full.addEventListener('click', function () {
    var d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    full.textContent = document.fullscreenElement ? '✕' : '⛶';
  });
  setTimeout(function () { document.getElementById('hint').classList.add('off'); }, 5000);

  /* Miniatura liviana: `scripts/panos_thumbs.py` deja en panos/thumbs/ el
     cuadrado central de cada pano a 160 px (el mismo encuadre que ya mostraba
     el círculo). Son 59 KB en total contra los 38 MB de los panos completos.
     Si falta alguna, se cae al pano original: pesa, pero no se rompe. */
  function thumb(pano) {
    return 'panos/thumbs/' + pano.split('/').pop().replace(/\.[^.]+$/, '') + '.jpg';
  }

  function armarMiniaturas() {
    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    h.estaciones.forEach(function (s) {
      var est = E[s];
      var b = document.createElement('button');
      b.className = 'tour-est';
      b.dataset.slug = s;
      var foto = document.createElement('span');
      foto.className = 'tour-est__foto';
      var mini = thumb(est.pano);
      foto.style.backgroundImage = 'url("' + mini + '")';
      var probe = new Image();
      probe.onerror = function () { foto.style.backgroundImage = 'url("' + est.pano + '")'; };
      probe.src = mini;
      var txt = document.createElement('span');
      txt.className = 'tour-est__nombre';
      txt.textContent = est.nombre;
      b.appendChild(foto); b.appendChild(txt);
      b.addEventListener('click', function () { saltar(s); });
      nav.appendChild(b);
    });
  }

  /* Precarga acotada: solo las 2 estaciones más cercanas, y sin guardar la
     referencia (alcanza con dejar los bytes en la caché HTTP). En celular no
     conviene tener 11 panos de 6000x3000 decodificados a la vez. */
  function precargarVecinas(slug) {
    var est = E[slug], hm = humedalDe(slug);
    if (!est.centro || !hm) return;
    // Cada pano pesa 3-5 MB: si el visitante pidió ahorro de datos o está con
    // mala señal (muy probable parado en el humedal), no precargamos nada.
    var con = navigator.connection || {};
    if (con.saveData || /(^|-)2g$/.test(con.effectiveType || '')) return;
    hm.estaciones
      .filter(function (s) { return s !== slug && E[s].centro; })
      .map(function (s) { return { s: s, d: distM(est.centro, E[s].centro) }; })
      .sort(function (a, b) { return a.d - b.d; })
      .slice(0, 2)
      .forEach(function (x) { var im = new Image(); im.src = E[x.s].pano; });
  }

  /* Giro automático solo cuando nadie toca nada: ahora el rumbo importa, así
     que no puede estar girando mientras mirás. */
  var tRot;
  function reprogramarGiro() {
    clearTimeout(tRot);
    if (viewer) viewer.stopAutoRotate();
    tRot = setTimeout(function () { if (viewer) viewer.startAutoRotate(-1.4); }, 14000);
  }
  ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach(function (ev) {
    document.getElementById('panorama').addEventListener(ev, reprogramarGiro, { passive: true });
  });

  /* Brújula. El rumbo real hacia donde mirás es `yaw + norte` (el mismo criterio
     con el que se calculan las flechas), así que la rosa se gira lo contrario
     para que la punta roja quede siempre en el norte verdadero. */
  var rosa = document.getElementById('rosa'), rosaAnt = null;
  (function girarRosa() {
    if (viewer && actual) {
      var g = -(viewer.getYaw() + (E[actual].norte || 0));
      g = ((g % 360) + 360) % 360;
      if (rosaAnt === null || Math.abs(g - rosaAnt) > 0.2) {
        rosa.style.transform = 'rotate(' + g.toFixed(1) + 'deg)';
        rosaAnt = g;
      }
    }
    requestAnimationFrame(girarRosa);
  })();
  document.getElementById('brujula').addEventListener('click', function () {
    if (!viewer || !actual) return;
    viewer.setYaw(normYaw(-(E[actual].norte || 0)), 900);   // mirar al norte
    reprogramarGiro();
  });

  function alLlegar(slug) {
    actual = slug;
    var est = E[slug], hm = humedalDe(slug);

    if (hm && hm.id !== id) {         // cruzamos a otro humedal
      h = hm; id = hm.id;
      localStorage.setItem('ph_ultimo_humedal', id);
      document.getElementById('back').href = 'humedal.html?id=' + id;
      armarMiniaturas();
    }

    document.getElementById('t-titulo').textContent = est.nombre;
    document.getElementById('t-tema').textContent = h.nombre + ' · ' + est.tema;

    var a = document.getElementById('t-accion');
    if (est.accion === 'reportar') {
      a.textContent = '⚠️ ' + est.accion_texto; a.href = 'reportar.html?id=' + id; a.onclick = null;
    } else if (est.accion === 'descubrir') {
      a.textContent = '✨ ' + est.accion_texto; a.href = '#';
      a.onclick = function (e) {
        e.preventDefault();
        var n = phNarrarEstacion(slug, h.especies); phDecir(n.texto, { quien: n.quien });
      };
    } else {
      a.textContent = '📷 ' + est.accion_texto; a.href = 'avistar.html?id=' + id; a.onclick = null;
    }

    document.querySelectorAll('#nav .tour-est').forEach(function (b) {
      b.classList.toggle('act', b.dataset.slug === slug);
    });

    // El avatar ELEGIDO narra: 1a persona si su especie esta presente en el
    // humedal, o como guia si no (regla de voz, escalable por `especies`).
    var _nar = phNarrarEstacion(slug, h.especies);
    phDecir(_nar.texto, { quien: _nar.quien });

    precargarVecinas(slug);
    reprogramarGiro();

    // Progresión por completar el tour (insignia, sin puntos canjeables:
    // los puntos solo se ganan con acciones geolocalizadas en terreno)
    var vis = JSON.parse(sessionStorage.getItem('ph_tour_vis') || '[]');
    if (vis.indexOf(slug) < 0) { vis.push(slug); sessionStorage.setItem('ph_tour_vis', JSON.stringify(vis)); }
    var deEste = vis.filter(function (s) { return h.estaciones.indexOf(s) >= 0; });
    if (deEste.length === h.estaciones.length && phDarInsignia('tour-' + id)) {
      setTimeout(function () {
        phDecir('Conociste todas las estaciones de ' + h.nombre + ': ya conocés el barrio 🏅. Los puntos se ganan en terreno: vení al humedal a avistar, reconocer o reportar.');
      }, 2500);
    }
  }

  document.getElementById('back').href = 'humedal.html?id=' + id;
  armarMiniaturas();

  viewer = pannellum.viewer('panorama', {
    default: {
      firstScene: h.estaciones[0],
      sceneFadeDuration: 700,
      autoLoad: true, showControls: false, compass: false,
      friction: 0.15
    },
    scenes: scenes
  });
  viewer.on('scenechange', alLlegar);
  alLlegar(h.estaciones[0]);   // la primera escena no dispara 'scenechange'
})();
</script>
</body>
</html>
