<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F1E7">
<title>Humedales de Valdivia · Red de Isla Teja</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/suave.css?v=m9">
</head>
<body data-tab="mapa">

<!-- Mapa a pantalla completa -->
<div id="mapa" class="mapa-full"></div>

<!-- Píldora superior (marca) -->
<div class="mapa-pill">
  <span class="logo">🦢</span>
  <span style="flex:1;min-width:0"><strong>Humedales de Valdivia</strong><small>Red de Isla Teja</small></span>
  <span class="campana" role="button" tabindex="0" aria-label="Novedades">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3a5a3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span class="dot"></span>
  </span>
</div>

<!-- Controles flotantes -->
<div class="mapa-stack">
  <button id="btn-gps" aria-label="Mi ubicación">
    <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="#d7ded4" stroke-width="1.5"/><circle cx="24" cy="24" r="15" stroke="#eef1ec" stroke-width="1"/><path d="M24 6 27 24 24 21 21 24z" fill="#e5484d"/><path d="M24 42 21 24 24 27 27 24z" fill="#3a5a3f"/><path d="M42 24 24 27 27 24 24 21z" fill="#8a938a"/><path d="M6 24 24 21 21 24 24 27z" fill="#8a938a"/><circle cx="24" cy="24" r="2.4" fill="#21301f"/></svg>
  </button>
  <button id="btn-ayuda" aria-label="Ayuda">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3a5a3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.6 1.3c0 1.6-2.1 2-2.1 3.5"/><path d="M12 17.5h.01"/></svg>
  </button>
</div>

<!-- Sheet persistente: carrusel (peek) o detalle (al seleccionar) -->
<div class="mapa-sheet" id="sheet">
  <div class="asa"></div>

  <div id="modo-lista">
    <div class="sheet-head">
      <h3 id="s-titulo">7 humedales para visitar 🌿</h3>
      <a class="vertodos" href="#">Ver todos →</a>
    </div>
    <div class="mapa-carrusel" id="carrusel"></div>
  </div>

  <div id="modo-detalle" class="mapa-detalle hidden">
    <div id="d-chips"></div>
    <h2 id="d-nombre"></h2>
    <p class="dist" id="d-dist"></p>
    <p class="desc" id="d-desc"></p>
    <div class="botones">
      <a id="d-entrar" class="ph-btn ph-btn--prof" style="margin-top:0;">Entrar al humedal</a>
      <a id="d-ruta" class="ph-btn ph-btn--ghost" target="_blank" rel="noopener" style="margin-top:0;">Planificar ruta</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js?v=4"></script>
<script src="js/nav.js?v=4"></script>
<script>
(async function () {
  var map = L.map('mapa', { zoomControl: false, attributionControl: false }).setView(MAPA_CENTRO, MAPA_ZOOM);
  L.control.attribution({ position: 'topleft', prefix: false }).addAttribution('© OpenStreetMap').addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  // La contención desktop cambia el ancho del contenedor: re-medir el mapa.
  setTimeout(function () { map.invalidateSize(); map.setView(MAPA_CENTRO, MAPA_ZOOM); }, 150);
  window.addEventListener('resize', function () { map.invalidateSize(); });

  var meta = await (await fetch('data/humedales.json')).json();
  var geo = await (await fetch('data/humedales.geojson')).json();
  var byId = {}; meta.humedales.forEach(function (h) { byId[h.id] = h; });

  var miPos = null;
  navigator.geolocation && navigator.geolocation.getCurrentPosition(function (p) {
    miPos = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (selActual) pintarDetalle(selActual);
  }, function () {}, { maximumAge: 60000 });

  function distM(a, b) {
    var R = 6371e3, f1 = a[0]*Math.PI/180, f2 = b[0]*Math.PI/180;
    var df = (b[0]-a[0])*Math.PI/180, dl = (b[1]-a[1])*Math.PI/180;
    var x = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }
  function distTexto(m) { return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km'; }

  /* ---- Polígonos suaves + pins numerados ---- */
  L.geoJSON(geo, {
    style: function (f) {
      var h = byId[f.properties.id] || {};
      return { color: h.piloto ? '#C98A2D' : '#2C7A6E', weight: 1.5,
               fillColor: h.piloto ? '#C98A2D' : '#2C7A6E', fillOpacity: .18 };
    },
    onEachFeature: function (f, layer) {
      layer.on('click', function (e) { L.DomEvent.stopPropagation(e); seleccionar(byId[f.properties.id]); });
    }
  }).addTo(map);

  var pins = {};
  meta.humedales.forEach(function (h, i) {
    var icon = L.divIcon({
      className: '', iconSize: h.piloto ? [40, 40] : [34, 34], iconAnchor: h.piloto ? [20, 20] : [17, 17],
      html: '<div class="pin-humedal' + (h.piloto ? ' piloto' : '') + '" id="pin-' + h.id + '">' +
            (h.piloto ? '🦢' : (i + 1)) + '</div>'
    });
    pins[h.id] = L.marker(h.centro, { icon: icon }).addTo(map)
      .on('click', function () { seleccionar(h); });
  });

  /* ---- Carrusel (estado peek) ---- */
  document.getElementById('s-titulo').textContent = meta.humedales.length + ' humedales para visitar 🌿';
  var carrusel = document.getElementById('carrusel');
  carrusel.innerHTML = meta.humedales.map(function (h, i) {
    var chips = (h.tags || []).map(function (t) { return '<span class="sv-chip">' + t + '</span>'; }).join('');
    var foto = h.foto ? ' style="background-image:url(\'' + h.foto + '\')"' : '';
    return '<button class="mini-humedal' + (h.piloto ? ' piloto' : '') + '" data-h="' + h.id + '">' +
      '<div class="sv-foto"' + foto + '>' +
        '<span class="sv-num">' + (h.piloto ? '🦢' : (i + 1)) + '</span>' +
        '<span class="sv-fav" aria-label="Favorito"><svg viewBox="0 0 24 24" fill="none" stroke="#5a6b52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-8-.4L12 6l-.8-.8a5.5 5.5 0 0 0-8 8L12 21l8.8-8.8a5.5 5.5 0 0 0 0-6.6z"/></svg></span>' +
        (h.foto ? '' : '<span class="sv-ph">foto</span>') +
      '</div>' +
      '<div class="sv-body">' +
        '<div class="sv-nom">' + h.nombre + '</div>' +
        '<div class="sv-sub">' + (h.piloto ? 'Humedal piloto · tour 360°' : 'Red Isla Teja') + '</div>' +
        '<div class="sv-chips">' + chips +
          '<span class="sv-cta"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' +
        '</div>' +
      '</div>' +
    '</button>';
  }).join('');
  carrusel.querySelectorAll('.mini-humedal').forEach(function (c) {
    c.addEventListener('click', function () { seleccionar(byId[c.dataset.h]); });
  });
  carrusel.querySelectorAll('.sv-fav').forEach(function (f) {
    f.addEventListener('click', function (e) { e.stopPropagation(); f.classList.toggle('on'); });
  });

  /* ---- Selección: pin + zoom + detalle en el sheet ---- */
  var selActual = null;
  function seleccionar(h) {
    if (!h) return;
    selActual = h;
    Object.keys(pins).forEach(function (k) {
      var el = document.getElementById('pin-' + k);
      if (el) el.classList.toggle('sel', k === h.id);
    });
    map.flyTo(h.centro, 16, { duration: .6 });
    pintarDetalle(h);
    document.getElementById('modo-lista').classList.add('hidden');
    document.getElementById('modo-detalle').classList.remove('hidden');
  }
  function pintarDetalle(h) {
    var chips = '';
    if (h.piloto) chips += '<span class="ph-chip ph-chip--piloto">Piloto</span>';
    if (h.monitoreo_nivel) chips += '<span class="ph-chip ph-chip--nivel">Monitoreo de nivel</span>';
    document.getElementById('d-chips').innerHTML = chips;
    document.getElementById('d-nombre').textContent = h.nombre;
    document.getElementById('d-desc').textContent = h.descripcion;
    var destino = h.centro[0] + ',' + h.centro[1];
    var ruta = document.getElementById('d-ruta');
    if (miPos) {
      var d = distM([miPos.lat, miPos.lon], h.centro);
      document.getElementById('d-dist').textContent = 'A ' + distTexto(d) + ' de tu ubicación';
      ruta.href = 'https://www.google.com/maps/dir/?api=1&origin=' + miPos.lat + ',' + miPos.lon +
                  '&destination=' + destino + '&travelmode=' + (d > 2500 ? 'driving' : 'walking');
    } else {
      document.getElementById('d-dist').textContent = 'Isla Teja · Valdivia';
      ruta.href = 'https://www.google.com/maps/dir/?api=1&destination=' + destino + '&travelmode=walking';
    }
    document.getElementById('d-entrar').href = 'humedal.html?id=' + h.id;
  }

  // Tocar el mapa vuelve a la lista
  map.on('click', function () {
    selActual = null;
    Object.keys(pins).forEach(function (k) {
      var el = document.getElementById('pin-' + k);
      if (el) el.classList.remove('sel');
    });
    document.getElementById('modo-detalle').classList.add('hidden');
    document.getElementById('modo-lista').classList.remove('hidden');
  });

  /* ---- Botones flotantes ---- */
  document.getElementById('btn-gps').addEventListener('click', function () {
    if (!navigator.geolocation) { alert('Tu dispositivo no permite geolocalización.'); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      miPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      var best = null, bd = 1e18;
      meta.humedales.forEach(function (h) {
        var d = distM([miPos.lat, miPos.lon], h.centro);
        if (d < bd) { bd = d; best = h; }
      });
      L.circleMarker([miPos.lat, miPos.lon], {
        radius: 7, color: '#fff', weight: 2.5, fillColor: '#2E6E8E', fillOpacity: 1
      }).addTo(map).bindTooltip('Estás aquí');
      if (best) seleccionar(best);
    }, function () { alert('No pudimos obtener tu ubicación.'); });
  });

  document.getElementById('btn-ayuda').addEventListener('click', function () {
    alert('Tocá un humedal en el mapa (o una tarjeta de abajo) para ver cómo llegar y entrar.\n\n📍 te lleva al humedal más cercano.\n\nDentro de cada humedal te espera un habitante que te guía: tour 360°, avistamientos, reportes y cupones.');
  });

  // Ajustar el mapa a la red al inicio
  try {
    var b = L.latLngBounds(meta.humedales.map(function (h) { return h.centro; }));
    map.fitBounds(b.pad(0.25));
  } catch (e) {}
})();
</script>
</body>
</html>
